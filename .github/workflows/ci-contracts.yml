name: contracts

# "on" is quoted because it is a YAML 1.1 reserved boolean — quoting prevents
# editor language-server warnings while GitHub Actions still parses it correctly.
"on":
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/ci-contracts.yml"
  pull_request:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/ci-contracts.yml"

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: forge fmt + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show forge version
        run: forge --version

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-git
          forge install Vectorized/solady --no-git
          forge install Uniswap/v4-core --no-git
          forge install Uniswap/v4-periphery --no-git

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage report
        if: github.event_name == 'pull_request'
        run: |
          FOUNDRY_PROFILE=coverage forge coverage --report summary --report lcov || true

  invariants-deep:
    name: deep invariant sweep (nightly only)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: deep

    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install deps
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-git
          forge install Vectorized/solady --no-git
          forge install Uniswap/v4-core --no-git
          forge install Uniswap/v4-periphery --no-git
      - name: Run deep invariants
        run: forge test --match-path "test/invariant/**" -vvv
