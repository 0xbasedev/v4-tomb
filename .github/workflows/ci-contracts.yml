name: protocol checks
"on":
  push:
    branches: [main, merge, 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - run: node scripts/install-contract-deps.mjs
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build --sizes --skip test --skip script
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts
  frontend:
    runs-on: ubuntu-latest
    # Playwright's own image ships Chromium and its system libraries, so the job never
    # touches apt. The tag must match @playwright/test in frontend/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: node scripts/protocol.mjs validate
      - run: node --test config/schema.test.mjs config/masonry-launch.test.mjs config/create3.test.mjs config/masonry-deployment.test.mjs
      - run: pnpm build
        working-directory: frontend
      - run: pnpm test:browser
        working-directory: frontend
  invariants-deep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - run: node scripts/install-contract-deps.mjs
      - run: forge test --match-path 'test/invariant/**' -vv
        working-directory: contracts
