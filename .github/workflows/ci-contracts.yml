name: protocol checks
"on":
  push:
    branches: [main, merge, 'feat/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - run: node scripts/install-contract-deps.mjs
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build --sizes --skip test --skip script
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node scripts/protocol.mjs validate
      - run: node --test config/schema.test.mjs config/masonry-launch.test.mjs config/create3.test.mjs
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
  invariants-deep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: deep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - run: node scripts/install-contract-deps.mjs
      - run: forge test --match-path 'test/invariant/**' -vv
        working-directory: contracts
