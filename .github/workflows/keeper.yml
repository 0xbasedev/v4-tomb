name: keeper
# Explicitly opt in with repository variable KEEPER_ENABLED=true.
# Configure a GitHub environment named "keeper" with RPC_URL and
# KEEPER_PRIVATE_KEY secrets, and PROTOCOL_NETWORK_INDEX as a variable.
"on":
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protocol-keeper
  cancel-in-progress: false
jobs:
  tick:
    if: vars.KEEPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: keeper
    env:
      RPC_URL: ${{ secrets.RPC_URL }}
      KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
      PROTOCOL_NETWORK_INDEX: ${{ vars.PROTOCOL_NETWORK_INDEX || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - run: node scripts/install-contract-deps.mjs
      - run: node scripts/protocol.mjs validate
      - name: Advance epoch if due
        working-directory: contracts
        run: |
          test -n "$RPC_URL" && test -n "$KEEPER_PRIVATE_KEY"
          forge script script/KeeperTick.s.sol --rpc-url "$RPC_URL" --broadcast --slow
