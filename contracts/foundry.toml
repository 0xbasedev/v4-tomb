# Old Money — Foundry config
# https://book.getfoundry.sh/reference/config/

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

# Compiler pinning
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
via_ir = false

# Default test / fuzz / invariant settings (fast local loop)
verbosity = 2
fuzz = { runs = 256, max_test_rejects = 65536 }
invariant = { runs = 256, depth = 50, fail_on_revert = false, call_override = false }

# Extra outputs we want available for tests + frontend ABI export
extra_output = ["storageLayout"]
extra_output_files = ["abi"]

# Speed: skip unused warnings during default builds
ignored_warnings_from = ["lib"]


[profile.ci]
# Stricter coverage on PRs
fuzz = { runs = 1024, max_test_rejects = 65536 }
invariant = { runs = 1024, depth = 100, fail_on_revert = false }
verbosity = 3


[profile.deep]
# Pre-release invariant sweep. Run before audit handoff.
fuzz = { runs = 10000, max_test_rejects = 65536 }
invariant = { runs = 10000, depth = 200, fail_on_revert = false }
verbosity = 3


[profile.coverage]
# Coverage requires optimizer off so line numbers stay aligned
optimizer = false
via_ir = false


[profile.ir]
# Production deploy profile: via-IR produces tighter bytecode but is slow to compile.
via_ir = true
optimizer_runs = 1_000_000


[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"
wrap_comments = false
ignore = ["lib/**", "test/**/snapshots/**"]


# RPC endpoints — populated from .env at runtime
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"


# Block explorer verification
[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }


# See https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
