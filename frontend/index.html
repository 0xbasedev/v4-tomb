<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Identity -->
    <title>xTOMB</title>
    <meta
      name="description"
      content="xTOMB is an algorithmic stable protocol on BNB Chain. $xTOMB is defended by Uniswap V4 hooks and expanded by its Treasury when it trades above peg. Stake in xROOM to earn each expansion."
    />
    <meta name="theme-color" content="#0d0a05" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://oldmoney.xyz/" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#d4af37" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="xTOMB" />
    <meta property="og:title" content="xTOMB" />
    <meta
      property="og:description"
      content="Algorithmic stable on BNB Chain. $xTOMB is defended by Uniswap V4 hooks. Stake in xROOM, farm $xSHARE, swap with a capped sell tax."

    <meta property="og:url" content="https://oldmoney.xyz/" />
    <meta property="og:image" content="https://oldmoney.xyz/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="xTOMB — A house monogram with Art Deco sunburst on a near-black ground" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="xTOMB" />
    <meta
      name="twitter:description"
      content="An algorithmic stable on BNB Chain, defended by Uniswap V4 hooks."
    />
    <meta name="twitter:image" content="https://oldmoney.xyz/og-image.svg" />
    <meta name="twitter:image:alt" content="xTOMB — Art Deco sunburst monogram on near-black ground" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Art Deco type stack: Playfair Display (Bodoni substitute) + Cormorant Garamond (Didot substitute) + Cinzel (Trajan substitute, for labels) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cinzel:wght@400;500;600;700&display=swap"

    />

  <body class="bg-deco-ground">
    <noscript>
      <p style="color: #f5f0e0; background: #0d0a05; padding: 24px; font-family: Georgia, serif; text-align: center;">
        xTOMB is an on-chain protocol with a browser-based interface. Please enable JavaScript to use the site, or interact with the contracts directly on Base via your preferred wallet.
      </p>
